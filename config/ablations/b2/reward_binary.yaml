# config/ablations/b2/reward_binary.yaml
# B2: Reward Ablation – Binary reward (success-only, short run, seed=1)

experiment:
  name: b2_reward_binary
  group: b2_reward            # group all B2 runs together
  variant: binary             # used in folder naming / tables
  artifacts_root: artifacts/ablations/b2

seeds:
  # We only run seed = 1 for this ablation to save time.
  values: [1]

data:
  train_dataset: sorry_bench
  train_split: train
  eval_dataset: jailbreakbench_jbb_ood
  eval_split: test

target:
  # DeepSeek as the fixed target model for all B2 variants
  model_id: ollama/deepseek-r1:7b
  short_name: deepseek_r1_7b

judge:
  model_id: ollama/llama3:judge
  score_keys:
    success: success
    stealth: stealth
    impact: impact
    novelty: novelty
    efficiency: efficiency

rewriter:
  model_id: ollama/yi-9b
  enabled: true

env:
  env_id: sac_triad_env
  horizon_T: 8                  # attack depth (fixed for B2)
  max_query_budget: 5           # <= keeps episodes cheap
  max_steps_per_episode: 8

sac:
  # Shorter training for quick comparison
  total_env_steps: 3000         # was 5000; reduce to speed up
  warmup_steps: 500             # start learning earlier
  batch_size: 128
  gamma: 0.99
  tau: 0.005
  lr_actor: 3e-4
  lr_critic: 3e-4
  lr_alpha: 3e-4
  target_entropy_scale: 1.0
  update_every: 1
  gradient_steps_per_update: 1
  replay_buffer_size: 200000
  stratified_replay: true

reward:
  mode: binary
  success_key: success
  success_threshold: 0.5
  reward_success: 1.0
  reward_failure: 0.0
  clamp_min: -1.0
  clamp_max: 1.0

curriculum:
  enabled: false

train_logging:
  log_every_steps: 100          # more frequent logs for short run
  eval_every_steps: 1000        # 3 eval points over 3000 steps
  max_train_episodes: 2000      # upper bound; usually not hit first

eval:
  dataset: jailbreakbench_jbb_ood
  split: test
  max_episodes: 256             # was 1024; reduces eval cost
  query_budgets: [5]            # match training budget; fewer queries
  save_episodes: true

paths:
  run_root: "{artifacts_root}/{variant}/{target_short}/seed_{seed}"
  train_metrics_file: "train_metrics.json"
  train_events_file: "train_events.jsonl"
  eval_metrics_file: "eval_metrics.json"
  eval_episodes_file: "eval_episodes.jsonl"
