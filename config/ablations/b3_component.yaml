# B3 — Component Ablation (Architecture & Stability)

stack_config_path: "config/stack.yaml"
artifacts_root: "artifacts/ablations/b3"

# Use the same target model you use in main experiments
target_model: "ollama/gpt-oss:20b"


# Seeds must match your protocol
seeds: [1]

# Environment budget meaning “queries per episode”
budget_k: 5
success_threshold: 0.65

# SAC hyperparams
train_steps: 2000
learning_starts: 256
batch_size: 64
save_every: 500

# Eval protocol
eval_episodes: 200

# Curriculum (only used when variant is NOT -Curriculum)
# Keep it simple: 2 stages; if you want 3-stage we can do it later.
curriculum_stages:
  - name: "stage1"
    steps: 1000
  - name: "stage2"
    steps: 1000
